name: Database back to free

# One-off: moves one copy of the game's database from a paid tier back to the free Azure SQL offer
# (infra/back_to_free.py), then deploys the API again. The game is down for the few minutes between
# the two. Running it again once the database is free does nothing but redeploy. See
# docs/adr/0040-shared-portfolio-base.md.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which copy of the game
        type: choice
        options: [production, staging]
        default: production
      confirm:
        description: Type "free" to confirm (the game is down for a few minutes)
        type: string
        required: true

permissions:
  contents: read
  id-token: write   # sign in to Azure with OIDC
  packages: write   # the deploy that follows pushes the API image

env:
  DOTNET_NOLOGO: true

jobs:
  copy:
    if: inputs.confirm == 'free'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # The deploy's group, so a deploy from main never runs in the middle of the copy.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install sqlpackage
        run: dotnet tool install --global microsoft.sqlpackage

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Copy the database to a free one
        run: |
          python3 infra/back_to_free.py --resource-group "$RESOURCE_GROUP" \
            --shared-resource-group "$SHARED_GROUP" --environment "${{ inputs.environment }}"
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SHARED_GROUP: ${{ vars.AZURE_SHARED_RESOURCE_GROUP }}

  # Runs even when the copy failed: the copy takes the API down first, and this deploy brings it back
  # on whichever database has the name.
  deploy:
    needs: copy
    if: always() && needs.copy.result != 'skipped'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: ${{ inputs.environment }}
      full: true
    secrets: inherit
